<!doctype html><meta charset="utf-8"><title>界面逐页验收</title>
<style>body{font:14px system-ui;background:#f3f5f9;color:#253c59;padding:25px}button{padding:12px 24px}iframe{width:1180px;height:740px;border:1px solid #cdd7e5}pre{white-space:pre-wrap}</style>
<h1>界面逐页验收</h1><p>固定模拟数据。不会连接真实设备。</p><button id="run">开始逐页检查</button><pre id="status">等待开始</pre><div id="frame"></div><pre id="result"></pre>
<script>
document.getElementById('run').onclick=async function(){this.disabled=true;var pages=await (await fetch('/lab/pages')).json(),results=[];for(var page of pages){document.getElementById('status').textContent='检查 '+page+' ('+(results.length+1)+'/'+pages.length+')';var f=document.createElement('iframe');f.src='/'+page;document.getElementById('frame').replaceChildren(f);await new Promise(function(resolve){f.onload=function(){setTimeout(resolve,200);};setTimeout(resolve,5000);});var r={page:page};try{r.errors=f.contentWindow.__errors||[];r.shell=!!f.contentDocument.querySelector('.ui-app');r.forms=f.contentDocument.forms.length;r.switches=f.contentDocument.querySelectorAll('[role=switch]').length;r.horizontalOverflow=f.contentDocument.documentElement.scrollWidth>f.clientWidth+5;}catch(e){r.error=String(e);}results.push(r);document.getElementById('result').textContent=JSON.stringify(results.filter(function(x){return x.errors&&x.errors.length||x.error;}),null,2);}document.getElementById('status').textContent='完成 '+results.length+' 页';await fetch('/lab/report',{method:'POST',body:JSON.stringify(results)});this.disabled=false;};
</script>
